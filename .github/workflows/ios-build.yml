name: iOS build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Check design tokens
        run: ./Scripts/check-design-tokens.sh

      - name: Build (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -project TempoRep.xcodeproj \
            -scheme TempoRep \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project TempoRep.xcodeproj \
            -scheme TempoRep \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            CODE_SIGNING_ALLOWED=NO

      - name: List available simulators (only if tests failed to find a destination)
        if: failure()
        run: xcrun simctl list devices available

  fastlane-tooling:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "4.0.9"
          bundler: "4.0.23"
          bundler-cache: true
      - name: Validate tooling without signing or uploading
        env:
          FASTLANE_OPT_OUT_USAGE: "1"
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
        run: |
          ruby -c fastlane/Fastfile
          bundle exec fastlane --version
          bundle exec fastlane lanes
